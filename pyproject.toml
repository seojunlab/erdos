[project]
name = "erdos"
version = "0.1.0"
description = "AI-assisted computational explorations of open Erdős problems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.67.0",
    "numpy>=2.5.3",
    "pyyaml>=6.0",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erdos"]

[tool.pytest.ini_options]
testpaths = ["tests", "problems"]
addopts = "--import-mode=importlib"
norecursedirs = ["_*", ".*", "results", "figures", "checkpoints"]
